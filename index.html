<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Onest:wght@400;500;600;700&family=Pixelify+Sans:wght@500;600&display=swap">
<style>
/* Layout: IDE a tre colonne — Progetto | tela a nodi | Ispettore — con barra superiore e barra di stato.
   Materiali: deepslate (neutri freddi), rame (accento), colori dei blocchi comandi per le intestazioni dei nodi. */
:root {
  --bg: #111317; --canvas: #15181d; --panel: #1a1e24; --panel-2: #20252c; --raised: #282e36; --line: #2d333c; --line-2: #3a414c;
  --fg: #e9e6df; --fg-2: #b9bdc4; --muted: #878e99; --faint: #5e6570;
  --accent: #e2884a; --accent-2: #f3a46c; --on-accent: #1e1208; --accent-soft: rgba(226, 136, 74, .15);
  --ok: #5bbf9c; --warn: #e8b546; --err: #ef5d52; --info: #74b0ea;
  --grid: rgba(233, 230, 223, .04); --grid-M: rgba(116, 176, 234, .11);
  --node: #1e2329; --node-2: #262c33; --node-b: #373e49; --node-txt: #e9e6df;
  --wire-exec: #d8d3c6; --pulse: #ff4d3b;
  --pt-exec: #e9e6df; --pt-selector: #f2b54b; --pt-pos: #4cc5dc; --pt-text: #f07fb3; --pt-number: #85d870; --pt-string: #c9a0f5; --pt-cond: #f26c5e; --pt-item: #f28c3d; --pt-block: #c9a37b; --pt-any: #9aa4af;
  --c-evt: #c4661f; --c-rep: #7254c4; --c-flow: #2c8670; --c-chat: #9f730f; --c-ent: #af3d38; --c-ply: #3864ad; --c-wld: #457f32; --c-var: #1d808c; --c-dat: #84469d; --c-cond: #a2355b; --c-val: #57677a; --c-adv: #535a64;
  --f-a: #e2884a; --f-b: #5bbf9c; --f-c: #74b0ea; --f-d: #b48ae8; --f-e: #9aa4af;
  --mm-frame: rgba(233, 230, 223, .07); --mm-bg: rgba(17, 19, 23, .82);
  --mc-bg: #1d1d1d; --mc-fg: #ffffff;
  --shadow: 0 10px 28px -12px rgba(0, 0, 0, .65); --shadow-pop: 0 18px 50px -12px rgba(0, 0, 0, .7);
  --font-ui: "Onest", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-px: "Pixelify Sans", "Onest", ui-sans-serif, system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e6e3db; --canvas: #eeebe4; --panel: #f8f6f1; --panel-2: #efece5; --raised: #ffffff; --line: #dad5c9; --line-2: #c7c0b1;
    --fg: #1e2228; --fg-2: #3c424b; --muted: #676d77; --faint: #9a9fa7;
    --accent: #bf6224; --accent-2: #a4511b; --on-accent: #ffffff; --accent-soft: rgba(191, 98, 36, .12);
    --ok: #2a8a67; --warn: #a8760c; --err: #c4392e; --info: #2c70b4;
    --grid: rgba(30, 34, 40, .05); --grid-M: rgba(44, 112, 180, .13);
    --node: #fcfbf8; --node-2: #f1eee7; --node-b: #cfc8b9; --node-txt: #1e2228;
    --wire-exec: #4b5058; --pulse: #df3426;
    --pt-exec: #4b5058; --pt-selector: #c4870f; --pt-pos: #1c97ae; --pt-text: #cf528c; --pt-number: #46982f; --pt-string: #8757c4; --pt-cond: #cd4a3b; --pt-item: #cf6818; --pt-block: #97724c; --pt-any: #78828d;
    --mm-frame: rgba(30, 34, 40, .07); --mm-bg: rgba(248, 246, 241, .9);
    --shadow: 0 8px 22px -14px rgba(70, 55, 30, .45); --shadow-pop: 0 18px 44px -14px rgba(70, 55, 30, .45);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e6e3db; --canvas: #eeebe4; --panel: #f8f6f1; --panel-2: #efece5; --raised: #ffffff; --line: #dad5c9; --line-2: #c7c0b1;
  --fg: #1e2228; --fg-2: #3c424b; --muted: #676d77; --faint: #9a9fa7;
  --accent: #bf6224; --accent-2: #a4511b; --on-accent: #ffffff; --accent-soft: rgba(191, 98, 36, .12);
  --ok: #2a8a67; --warn: #a8760c; --err: #c4392e; --info: #2c70b4;
  --grid: rgba(30, 34, 40, .05); --grid-M: rgba(44, 112, 180, .13);
  --node: #fcfbf8; --node-2: #f1eee7; --node-b: #cfc8b9; --node-txt: #1e2228;
  --wire-exec: #4b5058; --pulse: #df3426;
  --pt-exec: #4b5058; --pt-selector: #c4870f; --pt-pos: #1c97ae; --pt-text: #cf528c; --pt-number: #46982f; --pt-string: #8757c4; --pt-cond: #cd4a3b; --pt-item: #cf6818; --pt-block: #97724c; --pt-any: #78828d;
  --mm-frame: rgba(30, 34, 40, .07); --mm-bg: rgba(248, 246, 241, .9);
  --shadow: 0 8px 22px -14px rgba(70, 55, 30, .45); --shadow-pop: 0 18px 44px -14px rgba(70, 55, 30, .45);
  color-scheme: light;
}
:root[data-theme="dark"] { color-scheme: dark; }

[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }
body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--muted); }
code { font-family: var(--font-mono); font-size: .92em; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
kbd { font: 500 10.5px var(--font-mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line-2); border-bottom-width: 2px; background: var(--panel-2); color: var(--fg-2); white-space: nowrap; }
.ico { flex: none; display: block; }

/* ---------- griglia app ---------- */
#app { display: grid; grid-template-rows: 48px minmax(0, 1fr) 28px; grid-template-columns: 268px minmax(0, 1fr) 352px; height: 100%; }
#top { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
#left { grid-row: 2; grid-column: 1; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#center { grid-row: 2; grid-column: 2; position: relative; min-width: 0; min-height: 0; }
#right { grid-row: 2; grid-column: 3; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#status { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--panel); border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); min-width: 0; overflow: hidden; white-space: nowrap; }
#status .grow { flex: 1; }
.stitem { display: flex; align-items: center; gap: 6px; }
.stitem.ok .ico { color: var(--ok); } .stitem.warn { color: var(--warn); }
.stbtn { display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 2px 8px; border-radius: 4px; color: var(--muted); font-size: 11.5px; }
.stbtn:hover { background: var(--panel-2); color: var(--fg); }
.stbtn.err { color: var(--err); } .stbtn.warn { color: var(--warn); } .stbtn.ok .ico { color: var(--ok); }

/* ---------- barra superiore ---------- */
.brand { display: flex; align-items: center; gap: 9px; margin-right: 8px; flex: none; }
.mark { width: 22px; height: 22px; border-radius: 3px; background: var(--c-evt); position: relative; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .28), inset 0 0 0 4px rgba(255, 255, 255, .14); }
.mark::before { content: ''; position: absolute; left: 6px; top: 6px; width: 10px; height: 10px; background: linear-gradient(135deg, transparent 0 34%, rgba(255, 255, 255, .92) 34% 54%, transparent 54%); clip-path: polygon(0 0, 100% 50%, 0 100%, 26% 50%); }
.bname { font: 600 17px var(--font-px); letter-spacing: .02em; }
.pname { flex: 0 1 280px; min-width: 60px; height: 32px; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 0 10px; font-weight: 500; }
.pname:hover { border-color: var(--line); } .pname:focus { border-color: var(--line-2); background: var(--panel-2); outline: none; }
.ver { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; flex: none; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--fg); font-weight: 500; white-space: nowrap; flex: none; }
.btn:hover { background: var(--raised); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; gap: 5px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--panel-2); }
.btn.danger { color: var(--err); }
.btn.danger:hover { background: color-mix(in srgb, var(--err) 14%, transparent); }
.btn:disabled { opacity: .45; cursor: default; }
.ib { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--fg-2); flex: none; padding: 0; }
.ib:hover:not(:disabled) { background: var(--panel-2); color: var(--fg); }
.ib:disabled { opacity: .35; cursor: default; }
.ib.tog.on { color: var(--accent); background: var(--accent-soft); }
.mob { display: none; }

/* ---------- tab e pannelli ---------- */
.tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); flex: none; }
.tabs button { position: relative; background: none; border: 0; padding: 7px 10px 9px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.tabs button:hover { color: var(--fg); }
.tabs button.on { color: var(--fg); }
.tabs button.on::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }
.tbadge:empty { display: none; }
.tbadge { font: 600 10px var(--font-mono); padding: 1px 6px; border-radius: 999px; background: var(--panel-2); }
.tbadge.err { background: var(--err); color: #fff; } .tbadge.warn { background: var(--warn); color: #1a1406; }
.pane { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px 24px; }
.pane[hidden] { display: none; }

/* esplora */
.packcard { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); text-align: left; margin-bottom: 16px; color: var(--fg-2); }
.packcard:hover, .packcard.on { border-color: var(--line-2); background: var(--raised); }
.pico { width: 34px; height: 34px; border-radius: 4px; image-rendering: pixelated; flex: none; object-fit: cover; }
.pico.big { width: 56px; height: 56px; }
.pico.ph { display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.pinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pinfo .pk-name { font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pns { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sec { margin-bottom: 14px; }
.sech { display: flex; align-items: center; gap: 7px; height: 30px; color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; }
.sech span:first-of-type { flex: 0 1 auto; }
.sech .cnt { font: 500 10.5px var(--font-mono); color: var(--faint); margin-right: auto; text-transform: none; letter-spacing: 0; }
.sech .ib { width: 26px; height: 26px; }
.secl { display: flex; flex-direction: column; gap: 1px; }
.item { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 3px 4px 3px 10px; border-radius: 6px; cursor: pointer; color: var(--fg-2); }
.item:hover { background: var(--panel-2); color: var(--fg); }
.item.on { background: var(--accent-soft); color: var(--fg); box-shadow: inset 2px 0 0 var(--accent); }
.iname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.imeta { font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.item .more { width: 26px; height: 26px; opacity: 0; }
.item:hover .more, .item:focus-within .more, .item.on .more { opacity: 1; }
.chip { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap; }
.chip.ent { border-color: color-mix(in srgb, var(--c-var) 60%, transparent); color: color-mix(in srgb, var(--c-var) 60%, var(--fg)); }
.dotlv { width: 7px; height: 7px; border-radius: 50%; flex: none; } .dotlv.err { background: var(--err); } .dotlv.warn { background: var(--warn); }
/* libreria */
.libsearch { display: flex; align-items: center; gap: 8px; padding: 0 10px; height: 34px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--panel-2); color: var(--muted); margin-bottom: 12px; }
.libsearch .f { border: 0; background: transparent; height: 100%; padding: 0; flex: 1; min-width: 0; }
.libsearch .f:focus { outline: none; }
.libcat { margin-bottom: 12px; }
.libh { display: flex; align-items: center; gap: 7px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; font-weight: 600; color: var(--muted); padding: 4px 2px; }
.libitem { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 6px 8px; color: var(--fg-2); cursor: grab; }
.libitem:hover { background: var(--panel-2); color: var(--fg); }
.dot { width: 9px; height: 9px; border-radius: 2px; background: var(--cat); flex: none; }
.libtip { color: var(--faint); font-size: 12px; }

/* ---------- tela ---------- */
.view { position: absolute; inset: 0; }
.view[hidden] { display: none; }
#canvas { position: absolute; inset: 0; overflow: hidden; touch-action: none; background-color: var(--canvas);
  background-image: linear-gradient(to right, var(--grid-M) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-M) 1px, transparent 1px), linear-gradient(to right, var(--grid) 1px, transparent 1px), linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size: var(--gM, 256px) var(--gM, 256px), var(--gM, 256px) var(--gM, 256px), var(--gm, 16px) var(--gm, 16px), var(--gm, 16px) var(--gm, 16px);
  background-position: var(--gx, 0) var(--gy, 0); }
#canvas.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#marquee { position: absolute; display: none; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 2px; pointer-events: none; }
.cvtools { position: absolute; display: flex; align-items: center; gap: 4px; z-index: 5; }
.cvtools.tl { left: 14px; top: 12px; color: var(--muted); font: 600 15px var(--font-px); gap: 8px; pointer-events: none; max-width: 40%; }
.cvtools.tl #crumb { color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cvtools.tr { right: 12px; top: 10px; background: var(--mm-bg); border: 1px solid var(--line); border-radius: 8px; padding: 3px; backdrop-filter: blur(6px); }
.cvtools.br { right: 12px; bottom: 150px; background: var(--mm-bg); border: 1px solid var(--line); border-radius: 8px; padding: 3px; backdrop-filter: blur(6px); }
.cvtools .ib { width: 30px; height: 30px; }
#zoomlbl { font: 500 11px var(--font-mono); color: var(--muted); min-width: 40px; text-align: center; }
.cvtools.tr .btn kbd { margin-left: 2px; }
#minimap { position: absolute; right: 12px; bottom: 12px; width: 200px; height: 128px; border-radius: 8px; border: 1px solid var(--line); background: var(--mm-bg); z-index: 5; cursor: pointer; backdrop-filter: blur(6px); }
#empty-hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--muted); }
#empty-hint[hidden] { display: none; }
#empty-hint p:first-child { font: 600 18px var(--font-px); color: var(--fg-2); margin: 0; }

/* cavi */
#wires path.w { fill: none; stroke: var(--pt-any); stroke-width: 2.2; opacity: .9; }
#wires path.w.exec { stroke: var(--wire-exec); stroke-width: 3; }
#wires path.w.t-selector { stroke: var(--pt-selector); } #wires path.w.t-pos { stroke: var(--pt-pos); } #wires path.w.t-text { stroke: var(--pt-text); }
#wires path.w.t-number { stroke: var(--pt-number); } #wires path.w.t-string { stroke: var(--pt-string); } #wires path.w.t-cond { stroke: var(--pt-cond); }
#wires path.w.t-item { stroke: var(--pt-item); } #wires path.w.t-block { stroke: var(--pt-block); }
#wires path.w.hl { stroke-width: 3.8; opacity: 1; }
#wires path.w.tmp { stroke-dasharray: 7 6; }
#wires path.pulse { fill: none; stroke: var(--pulse); stroke-width: 3.2; stroke-dasharray: 3 27; stroke-linecap: round; animation: signal .9s linear infinite; filter: drop-shadow(0 0 3px var(--pulse)); }
@keyframes signal { to { stroke-dashoffset: -30; } }

/* nodi */
.node { position: absolute; left: 0; top: 0; width: 252px; background: var(--node); border: 1px solid var(--node-b); border-radius: 6px; box-shadow: var(--shadow); color: var(--node-txt); font-size: 12px; user-select: none; -webkit-user-select: none; touch-action: none; }
.node.wide { width: 304px; }
.node.k-data, .node.k-cond { width: 224px; }
.node.k-data.wide { width: 276px; }
.node.sel { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent), var(--shadow); z-index: 3; }
.node.peek { box-shadow: 0 0 0 3px var(--info), var(--shadow); }
.node.off { opacity: .55; } .node.off .nh { filter: grayscale(.85); }
.node.has-err { border-color: color-mix(in srgb, var(--err) 70%, var(--node-b)); }
.nh { position: relative; display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 8px; background: var(--cat); color: #fff; border-radius: 5px 5px 0 0; font-weight: 600; letter-spacing: .01em; cursor: grab; }
.node.compact .nh { border-radius: 5px; }
.node.k-event .nh { height: 36px; padding: 0 10px; font: 600 14px var(--font-px); letter-spacing: .02em;
  background-color: var(--cat); background-image: linear-gradient(45deg, rgba(0, 0, 0, .13) 25%, transparent 25% 75%, rgba(0, 0, 0, .13) 75%), linear-gradient(45deg, rgba(0, 0, 0, .13) 25%, transparent 25% 75%, rgba(0, 0, 0, .13) 75%); background-size: 8px 8px; background-position: 0 0, 4px 4px; }
.node.k-event { border-radius: 3px; } .node.k-event .nh { border-radius: 2px 2px 0 0; }
.node.k-data .nh, .node.k-cond .nh { height: 27px; background: color-mix(in srgb, var(--cat) 82%, var(--node)); font-size: 11.5px; }

.nb { padding: 6px 0 8px; display: flex; flex-direction: column; gap: 2px; }

.row .lnk { flex: 1; min-width: 0; text-align: right; font: 10.5px var(--font-mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.node .mcprev { margin: 4px 9px 2px; }
.node .f { height: 24px; font-size: 11.5px; background: var(--node-2); border: 1px solid var(--line); border-radius: 4px; color: var(--node-txt); padding: 0 7px; min-width: 0; flex: 1 1 0; width: 0; }

/* pin */
.pin { position: relative; flex: none; width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--pc, var(--pt-any)); background: var(--node); cursor: crosshair; }
.pin.on { background: var(--pc, var(--pt-any)); }
.pin.t-exec { --pc: var(--pt-exec); border: 0; background: none; width: 14px; height: 14px; }
.pin.t-exec::before { content: ''; position: absolute; inset: 0; background: var(--pc); clip-path: polygon(0 0, 55% 0, 100% 50%, 55% 100%, 0 100%); }
.pin.t-exec:not(.on)::after { content: ''; position: absolute; inset: 3px 4px 3px 2.5px; background: var(--node); clip-path: polygon(0 0, 50% 0, 100% 50%, 50% 100%, 0 100%); }
.nh .pin.t-exec { --pc: #fff; }
.nh .pin.t-exec:not(.on)::after { background: var(--cat); }
.nh .pin[data-dir="out"] { margin-left: auto; }
.nh .pin:not(.t-exec) { background: var(--cat); border-color: #fff; } .nh .pin.on:not(.t-exec) { background: #fff; }
.pin.t-selector { --pc: var(--pt-selector); } .pin.t-pos { --pc: var(--pt-pos); } .pin.t-text { --pc: var(--pt-text); } .pin.t-number { --pc: var(--pt-number); }
.pin.t-string { --pc: var(--pt-string); } .pin.t-cond { --pc: var(--pt-cond); } .pin.t-item { --pc: var(--pt-item); } .pin.t-block { --pc: var(--pt-block); } .pin.t-any { --pc: var(--pt-any); }
.pin:hover { transform: scale(1.2); }
.linking .pin:not(.ok) { opacity: .3; }
.linking .pin.ok { box-shadow: 0 0 0 4px color-mix(in srgb, var(--pc) 30%, transparent); }
.pin.hot { transform: scale(1.4); }
.pdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--pc); margin-right: 6px; vertical-align: 1px; }
.pdot.t-exec { --pc: var(--pt-exec); } .pdot.t-selector { --pc: var(--pt-selector); } .pdot.t-pos { --pc: var(--pt-pos); } .pdot.t-text { --pc: var(--pt-text); } .pdot.t-number { --pc: var(--pt-number); } .pdot.t-string { --pc: var(--pt-string); } .pdot.t-cond { --pc: var(--pt-cond); } .pdot.t-item { --pc: var(--pt-item); } .pdot.t-block { --pc: var(--pt-block); } .pdot.t-any { --pc: var(--pt-any); }

/* riquadri */
.frame { position: absolute; left: 0; top: 0; border: 1px solid color-mix(in srgb, var(--fc) 45%, transparent); background: color-mix(in srgb, var(--fc) 6%, transparent); border-radius: 8px; pointer-events: none; }

.frame-t { overflow: hidden; text-overflow: ellipsis; }
.frame-h .f { height: 26px; font: 500 13px var(--font-ui); background: var(--panel); border: 1px solid var(--fc); border-radius: 4px; padding: 0 8px; width: 100%; }
.frame-rz { pointer-events: auto; position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; background: linear-gradient(135deg, transparent 55%, color-mix(in srgb, var(--fc) 70%, transparent) 55% 62%, transparent 62% 72%, color-mix(in srgb, var(--fc) 70%, transparent) 72% 79%, transparent 79%); border-radius: 0 0 7px 0; }

/* ---------- campi ---------- */
.f { height: 32px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 0 10px; color: var(--fg); min-width: 0; width: 100%; }
textarea.f { height: auto; padding: 8px 10px; resize: vertical; line-height: 1.5; }
textarea.f.big { min-height: 320px; font-size: 12.5px; }
.f:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.f.mono { font-family: var(--font-mono); font-size: 12px; }
.f.hex { padding: 2px; width: 44px; flex: none; }
.chk { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; color: var(--fg-2); min-width: 0; }
.chk input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chk .box { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--line-2); background: var(--panel-2); flex: none; display: grid; place-items: center; }

.seg { display: flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; background: var(--panel-2); min-width: 0; }

.node .seg button { height: 22px; font-size: 11px; padding: 0 5px; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button.on { background: var(--accent-soft); color: var(--accent); }
.seg.ask { border-color: var(--warn); box-shadow: 0 0 0 2px color-mix(in srgb, var(--warn) 22%, transparent); }
.seg.ask button { color: var(--warn); }
.sw { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px 0 6px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--fg-2); font-size: 12px; }
.sw::before { content: ''; width: 18px; height: 18px; border-radius: 3px; background: var(--sw); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .35); flex: none; }

.swgrid { display: grid; grid-template-columns: repeat(8, 24px); gap: 5px; }
.swgrid button { width: 24px; height: 24px; border-radius: 4px; border: 2px solid transparent; background: var(--sw); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .3); padding: 0; }
.swgrid button.on, .swgrid button:hover { border-color: var(--fg); }

/* ---------- ispettore ---------- */
.ihead { padding: 0 0 12px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.icat { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.icat::before { content: ''; width: 9px; height: 9px; border-radius: 2px; background: var(--cat, var(--accent)); }
.ihead h2 { margin: 4px 0 0; font: 600 19px var(--font-px); letter-spacing: .01em; text-wrap: balance; }

.iacts { display: flex; flex-wrap: wrap; gap: 6px; }
.dg { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; line-height: 1.45; padding: 7px 9px; border-radius: 6px; background: var(--panel-2); }

.keys { display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; margin: 0; font-size: 12px; align-items: baseline; }

.evlist { display: flex; flex-direction: column; gap: 4px; }
.evit { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; background: none; border: 1px solid var(--line); text-align: left; color: var(--fg-2); min-width: 0; }
.evit:hover { background: var(--panel-2); color: var(--fg); }
.evit .mono { margin-left: auto; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
/* selettore */
.selb { display: flex; flex-direction: column; gap: 8px; }
.selbases { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.selbases button { height: 30px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--panel-2); font: 500 12px var(--font-mono); color: var(--fg-2); padding: 0; }
.selbases button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.selrow { display: grid; grid-template-columns: 104px 28px minmax(0, 1fr) 28px; gap: 4px; align-items: center; }

.selrow .f { height: 30px; } .selrow .ib { width: 28px; height: 28px; }
.neg { height: 30px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--panel-2); font: 600 13px var(--font-mono); color: var(--muted); padding: 0; }
.neg.on { color: var(--err); border-color: var(--err); } .neg:disabled { opacity: .3; }
.selfoot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.selout { flex: 1; min-width: 0; word-break: break-all; color: var(--pt-selector); background: var(--panel-2); padding: 6px 8px; border-radius: 6px; }
/* testo */
.segs { display: flex; flex-direction: column; gap: 8px; }
.lbl2 { font-size: 11px; color: var(--muted); }
.mcprev { background: var(--mc-bg); color: var(--mc-fg); font: 500 13px/1.5 var(--font-px); padding: 6px 9px; border-radius: 4px; text-shadow: 2px 2px 0 rgba(0, 0, 0, .55); word-break: break-word; letter-spacing: .02em; }
.node .mcprev { font-size: 12px; padding: 4px 7px; }
.mcprev .clk { text-decoration-line: underline; text-decoration-style: dotted; }
.mcprev .obf { filter: blur(1.2px); }
.mcprev .dim { color: #9a9a9a; }
.seglist { display: flex; flex-direction: column; gap: 8px; }
.segcard { border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; background: var(--panel); }
.segrow { display: flex; gap: 6px; align-items: center; min-width: 0; }

.st { width: 28px; height: 28px; border-radius: 5px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--muted); font: 600 12px var(--font-mono); padding: 0; }

.kv { display: grid; grid-template-columns: minmax(70px, 34%) minmax(0, 1fr); gap: 8px; align-items: center; }
.kv .mono { font-size: 12px; color: var(--fg-2); }

/* ---------- codice ---------- */
.codebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; position: sticky; top: -14px; background: var(--panel); padding: 2px 0 8px; z-index: 1; }

.cfile { margin-bottom: 14px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--canvas); }

pre.code { margin: 0; padding: 6px 0; font: 11.5px/1.65 var(--font-mono); overflow-x: auto; }

.packimg { width: 64px; height: 64px; image-rendering: pixelated; margin: 8px 10px; }
.code .c { color: var(--faint); font-style: italic; }
.code .k { color: var(--accent); font-weight: 600; }
.code .kw { color: var(--info); }
.code .tsel { color: var(--pt-selector); }
.code .s { color: var(--pt-text); }
.code .nu { color: var(--pt-number); }
.code .co { color: var(--pt-pos); }
.code .rl { color: var(--pt-string); }
.code .fp { color: var(--pt-string); }
.code .m { color: var(--warn); font-weight: 600; }
.code .br { color: var(--muted); }
.code .jk { color: var(--info); }
/* problemi */
.prob { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; margin-bottom: 6px; color: var(--fg); }
.prob:hover { background: var(--panel-2); }
.prob .ico { margin-top: 2px; } .prob.err .ico { color: var(--err); } .prob.warn .ico { color: var(--warn); } .prob.info .ico { color: var(--info); }
.pm { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; line-height: 1.45; min-width: 0; }
.pw { font-size: 11px; color: var(--muted); }
.allok { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: var(--muted); padding: 40px 10px; }

/* ---------- ricerca nodi e menu ---------- */
.finder { position: fixed; z-index: 90; width: 340px; max-width: calc(100vw - 16px); max-height: 420px; display: flex; flex-direction: column; background: var(--raised); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow-pop); overflow: hidden; }
.fhead { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line); color: var(--muted); flex: none; }

.menu { position: fixed; z-index: 95; min-width: 220px; background: var(--raised); border: 1px solid var(--line-2); border-radius: 9px; padding: 5px; box-shadow: var(--shadow-pop); }

.menu button.danger { color: var(--err); }
.menu span.ico { width: 15px; }
.menu .sep { height: 1px; background: var(--line); margin: 5px 4px; }

/* ---------- finestre ---------- */
.modal-bg { position: fixed; inset: 0; z-index: 120; background: rgba(8, 9, 11, .55); display: grid; place-items: center; padding: 16px; animation: fade .15s ease-out; }

.fstat { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }

.slotlbl { pointer-events: none; padding: 5px 6px; font: 600 11px/1.15 var(--font-px); color: #fff; text-shadow: 1px 1px 0 #3f3f3f; word-break: break-word; }

.cone { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.flame { width: 28px; height: 28px; background: radial-gradient(circle at 50% 70%, #ffd34d 0 30%, #ff8a1f 31% 55%, transparent 56%); }
.rcopts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }

.setgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; max-width: 1100px; }
.setcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }

.inrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.integ { display: flex; flex-direction: column; gap: 4px; padding: 10px; border-radius: 8px; background: var(--panel-2); }

#toasts { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }

  ev: {
    pre: (n, c) => (c.p(n, 'mode') !== 'rejoin') ? [`tag @s add ${joinTag(c, n)}`] : [],

    }
  }
});

def('ev_adv', {
  cat: 'evt', hue: 'imp', kind: 'event', title: 'Advancement', tag: 'advancement',
  desc: T('Generates a hidden advancement: when the player earns it the function runs (as them) and the advancement is revoked so it can fire again. Filters use the 26.3 format (conditions with "type", minecraft:entity_type).', 'Genera un advancement invisibile: quando il giocatore lo ottiene parte la funzione (come lui) e l\'advancement viene revocato per poter ripartire. I filtri usano il formato 26.3 (condizioni con "type", minecraft:entity_type).'),
  props: [P.path(),
  { k: 'trigger', l: 'When the player…', t: 'sel', d: 'consume_item', o: ADV_TRIGGERS.map(t => [t[0], t[1]]), re: true },
  { k: 'item', l: 'Item', t: 'combo', dl: 'items', mono: true, d: '', ph: 'any', show: p => advHas(p.trigger, 'item') },
  { k: 'entity', l: 'Entity', t: 'combo', dl: 'entities', mono: true, d: '', ph: 'any', show: p => advHas(p.trigger, 'entity') },
  { k: 'block', l: 'Block', t: 'combo', dl: 'blocks', mono: true, d: '', ph: 'any', show: p => advHas(p.trigger, 'block') },
  { k: 'recipe', l: 'Recipe', t: 'combo', dl: 'recipes', mono: true, d: '', ph: 'namespace:recipe', show: p => advHas(p.trigger, 'recipe') },
  { k: 'dim', l: 'To dimension', t: 'sel', d: '', o: [['', 'any'], ...DIMENSIONS.map(d => [d, d.slice(10)])], show: p => advHas(p.trigger, 'dimension') }],
  ev: {
    pre: (n, c, fn) => [`advancement revoke @s only ${fn}`],
    reg: (n, c, fn, path) => {
      const p = n.p, tr = p.trigger || 'consume_item', cond = {};
      const it = String(p.item || '').trim(), en = String(p.entity || '').trim(), bl = String(p.block || '').trim();
      const has = k => advHas(tr, k);
      if (has('item') && it) {
        const pred = { items: rl(it) };
        if (tr === 'inventory_changed') cond.items = [pred];
        else if (tr === 'item_used_on_block') cond.location = [{ type: 'minecraft:match_tool', predicate: pred }];
        else cond.item = pred;
      }
      if (has('entity') && en) {
        // 26.3: entity predicate fields are namespaced (minecraft:entity_type)
        cond[tr === 'bred_animals' ? 'child' : 'entity'] = { 'minecraft:entity_type': rl(en) };
      }
      if (has('block') && bl) {
        // 26.3: block_state_property was removed; location_check tests the block at the event position
        cond.location = [{ type: 'minecraft:location_check', predicate: { block: { blocks: rl(bl) } } }, ...(cond.location || [])];
      }
      if (has('recipe') && p.recipe) cond.recipe_id = rl(p.recipe, c.ns);
      if (has('dimension') && p.dim) cond.to = p.dim;
      const crit = { trigger: 'minecraft:' + tr };
      if (Object.keys(cond).length) crit.conditions = cond;
      const adv = { criteria: { requirement: crit }, rewards: { function: fn } };
      c.file(`data/${c.ns}/advancement/${path}.json`, JSON.stringify(adv, null, 2), 'json', n);
    }
  }
});

def('fl_if', {
  cat: 'flow', kind: 'exec', title: 'Branch (if / else)',
  desc: T('Tests a condition. Connect a Condition node or type the part after "if" (e.g. entity @s[tag=boss]). When both branches are used, the result is stored in a temporary score so the condition is only evaluated once.', 'Controlla una condizione. Collega un nodo Condizione o scrivi a mano la parte dopo "if" (es. entity @s[tag=boss]). Se usi entrambi i rami, la condizione viene salvata in un punteggio temporaneo per non essere valutata due volte.'),
  props: [{ k: 'cond', l: 'Condition', t: 'text', pin: 'cond', mono: true, d: '', ph: 'entity @s[tag=x]' }],
  outs: [{ k: 'yes', l: 'True' }, { k: 'no', l: 'False' }, { k: 'out', l: 'Then' }],
  compile(n, c) {
    const ce = c.condc(n, 'cond');
    const yes = c.chain(n, 'yes'), no = c.chain(n, 'no');
    if (!ce) { c.diag('err', 'Branch: the condition is missing.', n); return []; }
    if (!yes.length && !no.length) { c.diag('warn', 'Branch: no branch is connected.', n); return []; }
    const L = [...ce.pre];
    if (yes.length && !no.length) return [...L, ...c.wrap(ce.mods, yes, n, 'if')];
    if (!yes.length && ce.simple) return [...L, ...c.wrap(flipMods(ce.mods), no, n, 'else')];
    const t = c.th(n, 'if');
    L.push(`scoreboard players set ${t} ${c.tmp()} 0`, `execute ${ce.mods} run scoreboard players set ${t} ${c.tmp()} 1`);
    if (yes.length) L.push(...c.wrap(`if score ${t} ${c.tmp()} matches 1`, yes, n, 'if'));
    if (no.length) L.push(...c.wrap(`if score ${t} ${c.tmp()} matches 0`, no, n, 'else'));
    return L;
  }
});
function flipMods(m) { return m.replace(/^(if|unless)\b/, x => x === 'if' ? 'unless' : 'if'); }

def('fl_loop', {
  cat: 'flow', kind: 'exec', title: 'Repeat N times',
  desc: T('Repeats the body N times using a recursive function and a temporary counter.', 'Ripete il corpo N volte con una funzione ricorsiva e un contatore temporaneo.'),
  props: [P.num('count', 'Times', 5)],
  outs: [{ k: 'body', l: 'Each loop' }, { k: 'out', l: 'Then' }],
  compile(n, c) {
    const body = c.chain(n, 'body'); if (!body.length) { c.diag('warn', 'Repeat: the body is empty.', n); return []; }
    const N = c.v(n, 'count') || '1', ti = c.th(n, 'i'), tn = c.th(n, 'n'), tmp = c.tmp();
    const id = c.subId('loop', n);
    const inner = [...body, { t: `scoreboard players add ${ti} ${tmp} 1` }, { t: `execute if score ${ti} ${tmp} < ${tn} ${tmp} run function ${id}` }];
    c.addSub(id, inner, n);
    const args = c.argsFor(inner);
    inner[inner.length - 1].t += args;
    return [`scoreboard players set ${ti} ${tmp} 0`, `scoreboard players set ${tn} ${tmp} ${N}`, `function ${id}${args}`];
  }
});
def('fl_ray', {
  cat: 'flow', kind: 'exec', title: 'Raycast from view',
  desc: T('Steps forward from the eyes of @s in the direction it is looking until it hits a block (or an entity) or runs out of distance. Every branch runs at the ray position; "Hits entity" runs as the entity that was hit. The caster has the <namespace>.ray tag while the raycast runs.', 'Avanza dagli occhi di @s nella direzione in cui guarda, a passi, finché non tocca un blocco (o un\'entità) o finisce la distanza. Ogni ramo parte alla posizione del raggio; "Colpisce entità" gira come l\'entità colpita. Chi lancia ha il tag <namespace>.ray durante il raycast.'),
  props: [P.num('dist', 'Distance (blocks)', 20), { k: 'step', l: 'Step', t: 'sel', d: '0.5', o: [['0.25', '0.25 blocks'], ['0.5', '0.5 blocks'], ['1', '1 block']] },
  { k: 'blocks', l: 'stops on blocks', t: 'bool', d: true }, { k: 'ents', l: 'stops on entities', t: 'bool', d: false, re: true },
  { k: 'filt', l: 'Entity filter', t: 'text', mono: true, d: 'type=!minecraft:item', show: p => !!p.ents, inl: false }],
  outs: [{ k: 'step', l: 'Each step' }, { k: 'hit', l: 'Hits block' }, { k: 'hitEnt', l: 'Hits entity' }, { k: 'miss', l: 'Hits nothing' }, { k: 'out', l: 'Then' }],
  compile(n, c) {
    const dist = Number(c.v(n, 'dist')); const step = Number(c.p(n, 'step') || 0.5);
    if (!isFinite(dist) || dist <= 0) { c.diag('err', 'Raycast: the distance must be a number greater than 0.', n); return []; }
    const steps = Math.ceil(dist / step), tmp = c.tmp(), tr = c.th(n, 'r'), th = c.th(n, 'h'), tag = `${c.ns}.ray`;
    const sStep = c.chain(n, 'step'), sHit = c.chain(n, 'hit'), sEnt = c.chain(n, 'hitEnt'), sMiss = c.chain(n, 'miss');
    const ray = c.subId('ray', n);
    const L = [...sStep, { t: `scoreboard players set ${th} ${tmp} 0` }];
    if (c.p(n, 'blocks') !== false) L.push({ t: `execute unless block ~ ~ ~ #minecraft:air run scoreboard players set ${th} ${tmp} 1` });
    if (c.p(n, 'ents')) {
      const f = String(c.p(n, 'filt') || '').trim();
      const es = `@e[dx=0,dy=0,dz=0,tag=!${tag}${f ? ',' + f : ''}]`;
      L.push({ t: `execute if score ${th} ${tmp} matches 0 positioned ~-0.5 ~-0.5 ~-0.5 if entity ${es} run scoreboard players set ${th} ${tmp} ${sEnt.length ? 2 : 1}` });
      if (sEnt.length) {
        const fe = c.sub('rayent', n, sEnt);
        L.push({ t: `execute if score ${th} ${tmp} matches 2 positioned ~-0.5 ~-0.5 ~-0.5 as ${es.replace(']', ',limit=1,sort=nearest]')} positioned ~0.5 ~0.5 ~0.5 run function ${fe}${c.argsFor(sEnt)}` });
      }
    }
    if (sHit.length) L.push(...c.wrap(`if score ${th} ${tmp} matches 1`, sHit, n, 'rayhit'));
    L.push({ t: `scoreboard players remove ${tr} ${tmp} 1` });
    if (sMiss.length) L.push(...c.wrap(`if score ${th} ${tmp} matches 0 if score ${tr} ${tmp} matches ..0`, sMiss, n, 'raymiss'));
    const rec = { t: `execute if score ${th} ${tmp} matches 0 if score ${tr} ${tmp} matches 1.. positioned ^ ^ ^${step} run function ${ray}` };
    L.push(rec);
    c.addSub(ray, L, n);
    const args = c.argsFor(L); rec.t += args;
    return [`tag @s add ${tag}`, `scoreboard players set ${tr} ${tmp} ${steps}`, `execute anchored eyes positioned ^ ^ ^ run function ${ray}${args}`, `tag @s remove ${tag}`];
  }
});
def('fl_delay', {
  cat: 'flow', kind: 'exec', title: 'Delay',
  desc: T('Runs the body after N ticks with /schedule. Without "keep @s" it runs as the server at world spawn; with it, the executor gets a tag and the body runs as them, at their position.', 'Esegue il corpo dopo N tick con /schedule. Senza "mantieni @s" gira come server alla posizione di spawn; con l\'opzione, l\'esecutore viene marcato con un tag e il corpo gira come lui alla sua posizione.'),
  props: [P.num('ticks', 'Ticks to wait', 20), { k: 'keep', l: 'keep @s and position', t: 'bool', d: true }],
  outs: [{ k: 'body', l: 'After waiting' }, { k: 'out', l: 'Then (now)' }],
  compile(n, c) {
    const body = c.chain(n, 'body'); if (!body.length) { c.diag('warn', 'Delay: the body is empty.', n); return []; }
    if (body.some(l => /\$\(/.test(l.t))) c.diag('err', 'Delay: /schedule cannot pass macro parameters to the body.', n);
    const t = Math.max(1, parseInt(c.v(n, 'ticks')) || 1);
    if (!c.p(n, 'keep')) { const id = c.sub('delay', n, body); c.uninstall(`schedule clear ${id}`); return [`schedule function ${id} ${t}t append`]; }
    const tag = `${c.ns}.wait.${c.short(n)}`;
    const inner = c.sub('delay_run', n, body);
    const outer = c.sub('delay', n, [{ t: `execute as @e[tag=${tag}] at @s run function ${inner}` }, { t: `tag @e[tag=${tag}] remove ${tag}` }]);
    c.uninstall(`schedule clear ${outer}`);
    return [`tag @s add ${tag}`, `schedule function ${outer} ${t}t append`];
  }
});
def('fl_call', {
  cat: 'flow', kind: 'exec', title: 'Call function',
  desc: T('Runs another function, from this project or from another data pack (e.g. realsize:reroll). If the function has macro parameters they appear below.', 'Esegue un\'altra funzione (del progetto o di un altro datapack, es. realsize:reroll). Se la funzione ha parametri macro compaiono qui sotto.'),
  props: [{ k: 'fn', l: 'Function', t: 'combo', dl: 'functions', mono: true, d: '', re: true, ph: 'utils/heal or pack:function' },
  { k: 'with', l: 'Arguments', t: 'sel', d: 'auto', re: true, o: [['auto', 'Values below'], ['storage', 'From a storage (with)'], ['entity', 'From @s (with entity)']] },
  { k: 'src', l: 'Storage', t: 'text', mono: true, d: '', ph: 'pack:args', show: p => p.with === 'storage' },
  { k: 'spath', l: 'NBT path', t: 'text', mono: true, d: '', ph: 'optional', show: p => p.with === 'storage' || p.with === 'entity' },
  { k: 'args', l: 'Parameters', t: 'args', d: {}, show: (p, x) => (p.with || 'auto') === 'auto' && x.fnParams(p.fn).length > 0 }],
  compile(n, c) {
    const ref = String(c.p(n, 'fn') || '').trim();
    if (!ref) { c.diag('err', 'Call function: choose the function to run.', n); return []; }
    const id = c.fnId(ref), w = c.p(n, 'with') || 'auto';
    if (w === 'storage') return [`function ${id} with storage ${rl(c.p(n, 'src') || 'args', c.ns)}${c.p(n, 'spath') ? ' ' + c.p(n, 'spath') : ''}`];
    if (w === 'entity') return [`function ${id} with entity @s${c.p(n, 'spath') ? ' ' + c.p(n, 'spath') : ''}`];
    const params = c.fnParams(ref);
    if (!params.length) return [`function ${id}`];
    const a = n.p.args || {};
    const parts = params.map(k => { const v = String(a[k] ?? '').trim(); if (v === '') c.diag('err', `Call function: parameter "${k}" is missing.`, n); return `${snbtKey(k)}:${macroVal(v)}`; });
    return [`function ${id} {${parts.join(',')}}`];
  }
});
function macroVal(v) { if (/^-?\d+(\.\d+)?[bsLfd]?$/i.test(v) || v === 'true' || v === 'false' || /^[{\[]/.test(v)) return v; return snbtStr(v); }

  { ...P.txt('name', 'Name', 'Boss'), show: p => !p.act || p.act === 'add' || p.act === 'name' }, { ...P.color('ncolor', 'Name color', 'white', 'name'), show: (p, x) => (!p.act || p.act === 'add' || p.act === 'name') && !x.has('name') },
  { ...P.num('val', 'Value', 100), show: p => p.act === 'value' || p.act === 'max' },
  { ...P.vr('var', 'Variable'), show: p => p.act === 'varval' }, { ...P.vtarget('vt', 'var'), show: (p, x) => p.act === 'varval' && x.varScope(p.var) === 'entity' },
  { k: 'bcolor', l: 'Color', t: 'sel', d: 'red', o: BOSSBAR_COLORS, show: p => p.act === 'color' },
  { k: 'style', l: 'Style', t: 'sel', d: 'progress', o: BOSSBAR_STYLES, show: p => p.act === 'style' },
  { ...P.sel('pl', 'Players', '@a'), show: p => p.act === 'players' },
  { k: 'vis', l: 'visible', t: 'bool', d: true, show: p => p.act === 'visible' }],
  compile(n, c) {
    const id = rl(c.p(n, 'id') || 'bar', c.ns), a = c.p(n, 'act') || 'add';
    if (a === 'add' || a === 'remove') c.bossbar(id);
    switch (a) {
      case 'add': return [`bossbar add ${id} ${c.text(n, 'name', 'ncolor')}`];
      case 'value': return [`bossbar set ${id} value ${c.v(n, 'val') || 0}`];
      case 'max': return [`bossbar set ${id} max ${c.v(n, 'val') || 100}`];
      case 'varval': { const r = c.varRef(n, 'var', 'vt'); return r ? [`execute store result bossbar ${id} value run scoreboard players get ${r.h} ${r.o}`] : []; }
      case 'name': return [`bossbar set ${id} name ${c.text(n, 'name', 'ncolor')}`];
      case 'color': return [`bossbar set ${id} color ${c.p(n, 'bcolor') || 'red'}`];
      case 'style': return [`bossbar set ${id} style ${c.p(n, 'style') || 'progress'}`];
      case 'players': return [`bossbar set ${id} players ${c.v(n, 'pl') || '@a'}`];
      case 'visible': return [`bossbar set ${id} visible ${c.p(n, 'vis') === false ? 'false' : 'true'}`];
      case 'remove': return [`bossbar remove ${id}`];
    }
    return [];
  }
});

def('en_summon', {
  cat: 'ent', kind: 'exec', title: 'Summon entity', wide: true,
  desc: T('Summons an entity with its data. When RealisticSize and FrameEditor are enabled in the project, choose here whether they should manage it: exclusion tags go straight inside the summon. Item frames get the block_pos required in 26.3 automatically, through a small macro.', 'Evoca un\'entità con i suoi dati. Con RealisticSize e FrameEditor attivi nel progetto, scegli qui se devono gestirla: i tag di esclusione vengono messi direttamente nel summon. Le cornici ricevono in automatico block_pos (obbligatorio in 26.3) tramite una piccola macro.'),
  props: [{ k: 'type', l: 'Entity', t: 'combo', dl: 'entities', mono: true, d: 'bee', re: true }, P.pos('pos', 'Position', '~ ~ ~'),
  { k: 'rs', l: 'Size', t: 'tri', d: 'ask', o: [['manage', 'RealisticSize'], ['exclude', 'Excluded']], re: true, show: (p, x) => x.proj.meta.integrations.realsize && isMobId(p.type), help: T('Managed: RealisticSize picks a random size. Excluded: the realsize.exclude tag goes inside the summon and the mob keeps its size (or the scale below).', 'Gestita: RealisticSize sceglie una dimensione casuale. Esclusa: il tag realsize.exclude va dentro il summon e il mob mantiene la sua dimensione (o la scala qui sotto).') },
  { k: 'fe', l: 'FrameEditor', t: 'tri', d: 'ask', o: [['manage', 'Managed'], ['exclude', 'Ignored']], re: true, show: (p, x) => x.proj.meta.integrations.frameeditor && isFrameId(p.type), help: T('Managed: the frame is registered with frame_editor:frame/init right after the summon. Ignored: the frame_editor.exclude tag goes inside the summon.', 'Gestita: la cornice viene registrata con frame_editor:frame/init subito dopo il summon. Ignorata: il tag frame_editor.exclude va dentro il summon.') },
  { k: 'name', l: 'Name', t: 'text', d: '', inl: false, grp: 'Name & tags' }, { k: 'ncolor', l: 'Name color', t: 'color', d: 'white', inl: false, grp: 'Name & tags', show: p => !!p.name }, { k: 'nvis', l: 'name always visible', t: 'bool', d: false, inl: false, grp: 'Name & tags', show: p => !!p.name },
  { k: 'tags', l: 'Tags', t: 'text', mono: true, d: '', ph: 'pack.boss, pack.enemy', inl: false, grp: 'Name & tags' },
  { k: 'noai', l: 'no AI (NoAI)', t: 'bool', d: false, inl: false, grp: 'Behavior' }, { k: 'silent', l: 'silent', t: 'bool', d: false, inl: false, grp: 'Behavior' },
  { k: 'inv', l: 'invulnerable', t: 'bool', d: false, inl: false, grp: 'Behavior' }, { k: 'pers', l: 'never despawns (PersistenceRequired)', t: 'bool', d: false, inl: false, grp: 'Behavior' },
  { k: 'glow', l: 'glowing outline', t: 'bool', d: false, inl: false, grp: 'Behavior' }, { k: 'nograv', l: 'no gravity', t: 'bool', d: false, inl: false, grp: 'Behavior' },
  { k: 'scale', l: 'Scale (scale attribute)', t: 'text', mono: true, d: '', ph: 'e.g. 0.5', inl: false, grp: 'Behavior', show: (p, x) => !(x.proj.meta.integrations.realsize && isMobId(p.type) && p.rs !== 'exclude') },
  { k: 'facing', l: 'Facing', t: 'sel', d: '1', inl: false, grp: 'Item frame', o: [['1', 'up (1)'], ['0', 'down (0)'], ['2', 'north (2)'], ['3', 'south (3)'], ['4', 'west (4)'], ['5', 'east (5)']], show: p => isFrameId(p.type) },
  { k: 'fitem', l: 'Item inside', t: 'combo', dl: 'items', mono: true, d: '', inl: false, grp: 'Item frame', show: p => isFrameId(p.type) },
  { k: 'finv', l: 'invisible frame', t: 'bool', d: false, inl: false, grp: 'Item frame', show: p => isFrameId(p.type) }, { k: 'ffix', l: 'fixed frame (Fixed)', t: 'bool', d: false, inl: false, grp: 'Item frame', show: p => isFrameId(p.type) },
  { k: 'pass', l: 'Passenger', t: 'combo', dl: 'entities', mono: true, d: '', ph: 'none', inl: false, grp: 'Advanced' },
  { k: 'nbt', l: 'Extra NBT', t: 'code', d: '', ph: '{Health:5f}', inl: false, grp: 'Advanced' }],
  summary(n, x) {
    const p = n.p, a = [];
    if (p.name) a.push('“' + p.name + '”');
    if (p.noai) a.push('NoAI'); if (p.inv) a.push('invulnerable'); if (p.tags) a.push('tags');
    if (p.scale && !(x.proj.meta.integrations.realsize && isMobId(p.type) && p.rs !== 'exclude')) a.push('scale ' + p.scale);
    return a.join(' · ');
  },
  compile(n, c) {
    const p = n.p, type = rl(c.p(n, 'type') || 'pig'), ints = c.proj.meta.integrations;
    const mob = isMobId(type), frame = isFrameId(type);
    const rsOn = ints.realsize && mob, feOn = ints.frameeditor && frame;
    const rs = p.rs || 'ask', fe = p.fe || 'ask';
    if (rsOn && rs === 'ask') c.diag('warn', `Summon ${type.slice(10)}: choose whether its size is managed by RealisticSize or excluded.`, n);
    if (feOn && fe === 'ask') c.diag('warn', `Summon ${type.slice(10)}: choose whether FrameEditor should manage or ignore this frame.`, n);
    const tags = String(p.tags || '').split(/[,\s]+/).map(s => s.trim()).filter(Boolean);
    tags.forEach(t => { if (!/^[A-Za-z0-9_.+-]+$/.test(t)) c.diag('err', `Invalid tag: "${t}".`, n); if (/^realsize\.(scaled|ignored)$|^fe\./.test(t)) c.diag('err', `The tag "${t}" is internal to another data pack: don't use it.`, n); });
    if (rsOn && rs === 'exclude') tags.push('realsize.exclude');
    const newTag = `${c.ns}.new`;
    if (feOn && fe === 'exclude') tags.push('frame_editor.exclude');
    if (feOn && fe === 'manage') tags.push(newTag);
    const nb = [];
    if (tags.length) nb.push(`Tags:[${[...new Set(tags)].map(snbtStr).join(',')}]`);
    if (p.name) { nb.push(`CustomName:{text:${snbtStr(p.name)}${p.ncolor && p.ncolor !== 'white' ? ',color:' + snbtStr(p.ncolor) : ''}}`); if (p.nvis) nb.push('CustomNameVisible:1b'); }
    if (p.noai) nb.push('NoAI:1b'); if (p.silent) nb.push('Silent:1b'); if (p.inv) nb.push('Invulnerable:1b');
    if (p.pers) nb.push('PersistenceRequired:1b'); if (p.glow) nb.push('Glowing:1b'); if (p.nograv) nb.push('NoGravity:1b');
    const sc = String(p.scale || '').trim();
    if (sc) {
      if (rsOn && rs !== 'exclude') c.diag('warn', 'Scale ignored: this mob is managed by RealisticSize, which would overwrite it. Exclude it to use your own scale.', n);
      else if (!isNum(sc) && !sc.includes('$(')) c.diag('err', 'The scale must be a number, e.g. 0.5.', n);
      else nb.push(`attributes:[{id:"minecraft:scale",base:${sc}${sc.includes('$(') ? '' : 'd'}}]`);
    }
    if (frame) {
      nb.push(`Facing:${parseInt(p.facing ?? 1) || 0}b`);
      if (p.fitem) nb.push(`Item:{id:${snbtStr(rl(p.fitem))},count:1}`);
      if (p.finv) nb.push('Invisible:1b'); if (p.ffix) nb.push('Fixed:1b');
    }
    if (p.pass) {
      const pt = rl(p.pass), ptags = rsOn && rs === 'exclude' && isMobId(pt) ? ['realsize.exclude'] : [];
      if (ints.realsize && isMobId(pt) && !mob) c.diag('warn', 'The passenger is a mob: RealisticSize will resize it (the Size choice only applies when the main entity is a mob too).', n);
      nb.push(`Passengers:[{id:${snbtStr(pt)}${ptags.length ? ',Tags:["realsize.exclude"]' : ''}}]`);
    }
    const extra = stripBraces(p.nbt);
    if (extra) nb.push(extra);
    const pos = c.v(n, 'pos') || '~ ~ ~';
    let L;
    if (frame) {
      // 26.3: summoned item frames need block_pos (absolute coordinates of the occupied block) → read with a marker, passed to a macro
      if (nb.some(x => x.includes('$('))) c.diag('err', 'Macro parameters cannot be used in the data of a summoned item frame.', n);
      const st = `${c.ns}:visipack`, mac = c.subId('frame', n), rd = c.subId('framepos', n);
      c.addSub(mac, [`summon ${type} ~0.5 ~0.5 ~0.5 {${[...nb, 'block_pos:[I;$(x),$(y),$(z)]'].join(',')}}`], n);
      c.addSub(rd, [`data modify storage ${st} frame set value {}`, `execute store result storage ${st} frame.x int 1 run data get entity @s Pos[0]`, `execute store result storage ${st} frame.y int 1 run data get entity @s Pos[1]`, `execute store result storage ${st} frame.z int 1 run data get entity @s Pos[2]`, 'kill @s', `function ${mac} with storage ${st} frame`], n);
      c.uninstall(`data remove storage ${st} frame`);
      L = [`execute positioned ${pos} align xyz summon minecraft:marker run function ${rd}`];
    } else L = [`summon ${type} ${pos}${nb.length ? ' {' + nb.join(',') + '}' : ''}`];
    if (feOn && fe === 'manage') L.push(`execute as @e[type=${type},tag=${newTag}] run function frame_editor:frame/init`, `tag @e[tag=${newTag}] remove ${newTag}`);
    return L;
  }
});

def('pl_give', {

def('wd_particle', {
  cat: 'wld', kind: 'exec', title: 'Particles',
  props: [{ k: 'pt', l: 'Particle', t: 'combo', dl: 'particles', mono: true, d: 'happy_villager', re: true }, P.pos('pos', 'Position', '~ ~1 ~'),
  { k: 'dcol', l: 'Dust color', t: 'hex', d: '#e08a4f', show: p => PARTICLES_DUST.includes(String(p.pt || '').replace('minecraft:', '')) },
  { k: 'dsc', l: 'Size', t: 'num', d: 1, show: p => PARTICLES_DUST.includes(String(p.pt || '').replace('minecraft:', '')) },
  { k: 'pb', l: 'Block', t: 'combo', dl: 'blocks', mono: true, d: 'stone', show: p => PARTICLES_BLOCK.includes(String(p.pt || '').replace('minecraft:', '')) },
  { k: 'pi', l: 'Item', t: 'combo', dl: 'items', mono: true, d: 'diamond', show: p => PARTICLES_ITEM.includes(String(p.pt || '').replace('minecraft:', '')) },
  { k: 'delta', l: 'Spread x y z', t: 'text', mono: true, d: '0.3 0.3 0.3' }, { k: 'speed', l: 'Speed', t: 'num', d: 0.02 }, P.num('count', 'Count', 10),
  { k: 'force', l: 'visible from far away (force)', t: 'bool', d: false, inl: false }, { ...P.sel('view', 'Only for', ''), inl: false }],
  compile(n, c) {
    const id = String(c.p(n, 'pt') || 'flame').replace('minecraft:', '');
    let opt = '';
    if (PARTICLES_DUST.includes(id)) { const hx = String(c.p(n, 'dcol') || '#ffffff').replace('#', ''); const r = parseInt(hx.slice(0, 2), 16) / 255, g = parseInt(hx.slice(2, 4), 16) / 255, b = parseInt(hx.slice(4, 6), 16) / 255; opt = `{color:[${r.toFixed(2)},${g.toFixed(2)},${b.toFixed(2)}],scale:${Number(c.p(n, 'dsc')) || 1}}`; }
    if (PARTICLES_BLOCK.includes(id)) opt = `{block_state:${snbtStr(rl(c.p(n, 'pb') || 'stone'))}}`;
    if (PARTICLES_ITEM.includes(id)) opt = `{item:{id:${snbtStr(rl(c.p(n, 'pi') || 'diamond'))}}}`;
    const view = c.v(n, 'view'), force = c.p(n, 'force');
    return [`particle minecraft:${id}${opt} ${c.v(n, 'pos') || '~ ~ ~'} ${c.p(n, 'delta') || '0 0 0'} ${c.p(n, 'speed') ?? 0} ${c.v(n, 'count') || 1}${force || view ? ' ' + (force ? 'force' : 'normal') : ''}${view ? ' ' + view : ''}`];
  }
});

def('vr_set', {

  desc: T('Variables are scoreboard scores, created automatically on load.', 'Le variabili sono punteggi della scoreboard creati in automatico al caricamento.'),
  props: [P.vr(), P.vtarget(), { k: 'mode', l: 'To', t: 'sel', d: 'val', re: true, o: [['val', 'a number'], ['rand', 'a random number'], ['copy', 'another variable']] },
  { ...P.num('val', 'Value', 0), show: p => (p.mode || 'val') === 'val' }, { ...P.num('min', 'From', 1), show: p => p.mode === 'rand' }, { ...P.num('max', 'To', 6), show: p => p.mode === 'rand' },
  { ...P.vr('var2', 'Copy from'), show: p => p.mode === 'copy' }, { ...P.vtarget('t2', 'var2'), show: (p, x) => p.mode === 'copy' && x.varScope(p.var2) === 'entity' }],

    const m = c.p(n, 'mode') || 'val';

    if (m === 'copy') { const r2 = c.varRef(n, 'var2', 't2'); return r2 ? [`scoreboard players operation ${r.h} ${r.o} = ${r2.h} ${r2.o}`] : []; }
    return [`scoreboard players set ${r.h} ${r.o} ${c.v(n, 'val') || 0}`];
  }
});

def('vr_op', {
  cat: 'var', kind: 'exec', title: 'Math operation',
  desc: T('Math between variables: add, multiply, integer divide, modulo, min, max, swap.', 'Calcolo tra variabili: somma, prodotto, divisione intera, resto, minimo, massimo, scambio.'),
  props: [P.vr('var', 'Result in'), P.vtarget(), { k: 'op', l: 'Operation', t: 'sel', d: '+=', o: [['+=', '+= add'], ['-=', '−= subtract'], ['*=', '×= multiply'], ['/=', '÷= divide'], ['%=', '%= modulo'], ['<', '< min'], ['>', '> max'], ['><', '>< swap']] },
  { k: 'mode', l: 'With', t: 'sel', d: 'num', re: true, o: [['num', 'a number'], ['var', 'a variable']] },
  { ...P.num('num', 'Number', 2), show: p => (p.mode || 'num') === 'num' }, { ...P.vr('var2', 'Variable'), show: p => p.mode === 'var' }, { ...P.vtarget('t2', 'var2'), show: (p, x) => p.mode === 'var' && x.varScope(p.var2) === 'entity' }],

def('vr_store', {
  cat: 'var', kind: 'exec', title: 'Store command result',
  desc: T('Runs a command and stores its result in a variable (e.g. how many entities it finds), or 1/0 for success.', 'Esegue un comando e salva in una variabile il suo risultato (es. quante entità trova) o 1/0 se è riuscito.'),
  props: [P.vr(), P.vtarget(), { k: 'mode', l: 'Store', t: 'sel', d: 'result', o: [['result', 'the result'], ['success', 'success (1/0)']] }, { k: 'cmd', l: 'Command', t: 'code', d: 'execute if entity @e[type=minecraft:zombie,distance=..16]' }],
  compile(n, c) {
    const r = c.varRef(n, 'var', 'target'); if (!r) return [];
    let cmd = normalizeCmd(String(c.p(n, 'cmd') || '').replace(/^\//, ''));
    if (!cmd) { c.diag('err', 'Store command result: type the command.', n); return []; }
    const head = `execute store ${c.p(n, 'mode') || 'result'} score ${r.h} ${r.o}`;
    return [cmd.startsWith('execute ') ? `${head} ${cmd.slice(8)}` : `${head} run ${cmd}`];
  }
});

/* ---------------- NBT DATA ---------------- */
const DT_TARGET = (pre = '') => [
  { k: pre + 'tt', l: 'On', t: 'sel', d: 'storage', re: true, o: [['storage', 'Storage'], ['entity', 'Entity'], ['block', 'Block']] },
  { k: pre + 'ts', l: 'Storage', t: 'text', mono: true, d: 'data', show: p => (p[pre + 'tt'] || 'storage') === 'storage' },
  { ...P.sel(pre + 'te', 'Entity', '@s'), show: p => p[pre + 'tt'] === 'entity' },
  { ...P.pos(pre + 'tb', 'Block', '~ ~-1 ~'), show: p => p[pre + 'tt'] === 'block' },
];
function dtTarget(n, c, pre = '') {
  const t = c.p(n, pre + 'tt') || 'storage';
  if (t === 'entity') return `entity ${c.v(n, pre + 'te') || '@s'}`;
  if (t === 'block') return `block ${c.v(n, pre + 'tb') || '~ ~ ~'}`;
  return `storage ${rl(c.p(n, pre + 'ts') || 'data', c.ns)}`;
}
def('dt_modify', {
  cat: 'dat', kind: 'exec', title: 'Modify NBT',
  desc: T('Writes NBT data to a storage, an entity (not players) or a block.', 'Scrive dati NBT in uno storage, un\'entità (non giocatori) o un blocco.'),
  props: [...DT_TARGET(), { k: 'act', l: 'Action', t: 'sel', d: 'set', re: true, o: [['set', 'Set path'], ['merge', 'Merge'], ['append', 'Append to list'], ['remove', 'Remove path']] },
  { k: 'path', l: 'Path', t: 'text', mono: true, d: 'counter', show: p => p.act !== 'merge' },
  { k: 'src', l: 'Value from', t: 'sel', d: 'value', re: true, o: [['value', 'typed value'], ['from', 'other data']], show: p => p.act === 'set' || !p.act || p.act === 'append' },
  { k: 'val', l: 'SNBT value', t: 'code', d: '1', show: p => (p.act !== 'remove') && (p.act === 'merge' || (p.src || 'value') === 'value') },
  ...DT_TARGET('f').map(x => ({ ...x, l: x.k === 'ftt' ? 'From' : x.l, show: (p) => (p.act === 'set' || !p.act || p.act === 'append') && p.src === 'from' && (!x.show || x.show(p)) })),
  { k: 'fpath', l: 'Source path', t: 'text', mono: true, d: 'Pos', show: p => (p.act === 'set' || !p.act || p.act === 'append') && p.src === 'from' }],
  compile(n, c) {
    const tgt = dtTarget(n, c), a = c.p(n, 'act') || 'set', path = c.p(n, 'path') || 'x';
    if (tgt.startsWith('entity @a') || tgt.startsWith('entity @p')) c.diag('warn', 'Player data cannot be modified with /data.', n);
    if (a === 'merge') return [`data merge ${tgt} ${c.p(n, 'val') || '{}'}`];
    if (a === 'remove') return [`data remove ${tgt} ${path}`];
    const verb = a === 'append' ? 'append' : 'set';
    if (c.p(n, 'src') === 'from') return [`data modify ${tgt} ${path} ${verb} from ${dtTarget(n, c, 'f')} ${c.p(n, 'fpath') || ''}`.trim()];
    return [`data modify ${tgt} ${path} ${verb} value ${c.p(n, 'val') || '0'}`];
  }
});
def('dt_get', {
  cat: 'dat', kind: 'exec', title: 'Read NBT into variable',
  desc: T('Reads a number from NBT data (e.g. a mob\'s Health, a player\'s Pos[1]) and stores it in a variable, multiplied by the scale.', 'Legge un numero dai dati NBT (es. Health di un mob, Pos[1] di un giocatore) e lo salva in una variabile, moltiplicato per la scala.'),
  props: [P.vr(), P.vtarget(), ...DT_TARGET('s').map(x => x.k === 'stt' ? { ...x, d: 'entity' } : x), { k: 'path', l: 'Path', t: 'text', mono: true, d: 'Health' }, { k: 'scale', l: 'Scale', t: 'num', d: 1 }],
  compile(n, c) { const r = c.varRef(n, 'var', 'target'); if (!r) return []; return [`execute store result score ${r.h} ${r.o} run data get ${dtTarget(n, c, 's')} ${c.p(n, 'path') || 'Health'} ${c.p(n, 'scale') ?? 1}`]; }
});

function lit(txt, neg = false) { return { k: 'lit', mod: neg ? 'unless' : 'if', txt }; }
function rawCond(s) { s = String(s || '').trim(); if (!s) return null; if (s.startsWith('unless ')) return lit(s.slice(7), true); if (s.startsWith('if ')) s = s.slice(3); return lit(s); }

function selToString(s) {

  props: [{ k: 'mode', l: 'Type', t: 'sel', d: '~', o: [['~', 'relative ~'], ['^', 'local ^'], ['', 'absolute']] }, { k: 'x', l: 'X', t: 'text', mono: true, d: '0' }, { k: 'y', l: 'Y', t: 'text', mono: true, d: '1' }, { k: 'z', l: 'Z', t: 'text', mono: true, d: '0' }],

def('vl_text', {
  cat: 'val', kind: 'data', title: 'Text', wide: true, desc: T('Formatted text in segments: colors, styles, scores, click and hover.', 'Testo formattato a segmenti: colori, stili, punteggi, click e hover.'),
  props: [{ k: 'segs', l: 'Segments', t: 'segments', d: [{ type: 'text', text: 'Hello ', color: 'gold', b: true }, { type: 'sel', text: '@s', color: 'aqua' }] }],
  dataOuts: [{ k: 'v', t: 'text', l: '' }],
  value: (n, c) => segsToSnbt(n.p.segs || [], c)
});
function segToObj(s, c) {
  const o = [];
  switch (s.type) {
    case 'score': o.push(`score:{name:${snbtStr(s.text || '@s')},objective:${snbtStr(s.obj || 'points')}}`); break;
    case 'var': { const r = c ? c.varRefRaw(s.var, s.text || '@s') : null; o.push(r ? `score:{name:${snbtStr(r.h)},objective:${snbtStr(r.o)}}` : 'text:"?"'); break; }
    case 'sel': o.push(`selector:${snbtStr(s.text || '@s')}`); break;
    case 'key': o.push(`keybind:${snbtStr(s.text || 'key.jump')}`); break;
    case 'tr': o.push(`translate:${snbtStr(s.text || '')}`); break;
    default: o.push(`text:${snbtStr(s.text ?? '')}`);
  }
  if (s.color && s.color !== 'inherit') o.push(`color:${snbtStr(s.color)}`);
  if (s.b) o.push('bold:true'); if (s.i) o.push('italic:true'); if (s.u) o.push('underlined:true'); if (s.s) o.push('strikethrough:true'); if (s.o) o.push('obfuscated:true');
  if (s.ca && s.cv) {
    const key = s.ca === 'open_url' ? 'url' : s.ca === 'copy_to_clipboard' ? 'value' : s.ca === 'change_page' ? 'page' : 'command';
    const val = s.ca === 'change_page' ? (parseInt(s.cv) || 1) : snbtStr(s.ca.endsWith('_command') && !s.cv.startsWith('/') ? '/' + s.cv : s.cv);
    o.push(`click_event:{action:${snbtStr(s.ca)},${key}:${val}}`);
  }
  if (s.hv) o.push(`hover_event:{action:"show_text",value:${snbtStr(s.hv)}}`);
  return `{${o.join(',')}}`;
}
function segsToSnbt(segs, c) { if (!segs.length) return '""'; if (segs.length === 1) return segToObj(segs[0], c); return `["",${segs.map(s => segToObj(s, c)).join(',')}]`; }

    const en = (p.ench || []).filter(e => e.id);
    if (en.length) comp.push(`minecraft:enchantments={${en.map(e => `${snbtStr(rl(e.id))}:${parseInt(e.lvl) || 1}`).join(',')}}`);
    if (p.unbr) comp.push('minecraft:unbreakable={}');

    if (p.model) comp.push(`minecraft:item_model=${snbtStr(rl(p.model))}`);

    const cd = String(p.cdata || '').trim(); if (cd) comp.push(`minecraft:custom_data=${cd.startsWith('{') ? cd : '{' + cd + '}'}`);
    if (c && c.proj.meta.integrations.frameeditor && isFrameId(id)) {

      if (p.fe === 'exclude') comp.push(`minecraft:entity_data={id:${snbtStr(id)},Tags:["frame_editor.exclude"]}`);

    const ex = String(p.extra || '').trim(); if (ex) comp.push(ex.replace(/^\[|\]$/g, ''));

def('ad_raw', {
  cat: 'adv', kind: 'exec', title: 'Command', wide: true,
  desc: T('One or more hand-written commands, one per line. A leading / is removed and double spaces are fixed automatically.', 'Uno o più comandi scritti a mano, uno per riga. La / iniziale viene tolta e gli spazi doppi corretti in automatico.'),
  props: [{ k: 'cmd', l: 'Commands', t: 'code', d: 'say Hello!', rows: 3 }],
  compile(n, c) {
    const out = [];
    String(c.p(n, 'cmd') || '').split('\n').forEach((raw, i) => {
      let l = raw.replace(/\s+$/, ''); if (!l.trim()) return;
      if (l.trim().startsWith('#')) { out.push(l.trim()); return; }
      let t = l.trim(); if (t.startsWith('/')) { t = t.slice(1); c.diag('info', `Command line ${i + 1}: removed the leading / (it is not allowed in .mcfunction files).`, n); }
      const nn = normalizeCmd(t); if (nn !== t) c.diag('info', `Command line ${i + 1}: double spaces reduced to one (double spaces make the function fail on /reload).`, n);
      out.push(nn);
    });
    if (!out.length) c.diag('warn', 'Empty command.', n);
    return out;
  }
});

/* ============ Compiler: graphs → data pack files ============ */
const RESERVED_OBJ = ['tmp', 'var', 'deaths', 'leave', 'use', 'ray', 'new', 'wait', 'joined'];
function parseParams(s) { return String(s || '').split(/[,\s]+/).map(x => x.trim()).filter(Boolean); }
function macroNames(text) { const s = new Set(); String(text).replace(/\$\(([A-Za-z0-9_]+)\)/g, (_, k) => s.add(k)); return s; }

class Compiler {
  constructor(proj) {
    this.proj = proj;
    this.ns = (proj.meta.namespace || 'pack').trim();
    this.files = new Map();
    this.diags = []; this._dk = new Set();
    this.loadTag = []; this.tickTag = [];
    this.initLines = []; this.tickLines = []; this.tickEndLines = []; this.uninst = [];
    this.objectives = new Map(); this.bossbars = new Set(); this.usedTmp = false;
    this.fnPaths = new Map();
    this.g = null; this.idx = null; this.cur = null;
    this.execStack = []; this.dataStack = []; this.visited = new Set();
  }
  /* ---- diagnostica ---- */
  diag(lvl, msg, n, extra) {
    const key = lvl + '|' + msg + '|' + (n ? n.id : '');
    if (this._dk.has(key)) return; this._dk.add(key);
    this.diags.push({ lvl, msg, node: n ? n.id : null, graph: n && this.g ? this.g.id : (extra && extra.graph) || null, ref: extra && extra.ref || null });
  }
  /* ---- accesso ai valori ---- */
  p(n, k) { const v = n.p ? n.p[k] : undefined; if (v === undefined) { const pd = (NODES[n.type].props || []).find(x => x.k === k); return pd ? pd.d : undefined; } return v; }
  link(n, k) { return this.idx.inLink.get(n.id + '|' + k); }
  has(n, k) { return !!this.link(n, k); }
  v(n, k) {
    const L = this.link(n, k);
    if (L) { const src = this.idx.nodes.get(L.a); if (!src) return ''; const r = this.evalData(src, L.ap); return typeof r === 'string' ? r.trim() : ''; }
    const v = this.p(n, k); return v == null ? '' : String(v).trim();
  }
  evalData(src, outKey) {
    const d = NODES[src.type]; if (!d || !d.value) return '';
    if (this.dataStack.includes(src.id)) { this.diag('err', 'Circular link between value nodes.', src); return ''; }
    this.dataStack.push(src.id); this.visited.add(src.id);
    try { return d.value(src, this, outKey); } catch (e) { this.diag('err', 'Node error: ' + e.message, src); return ''; }
    finally { this.dataStack.pop(); }
  }
  text(n, k, colorKey) {
    if (this.has(n, k)) return this.v(n, k) || '""';
    const t = this.p(n, k) ?? ''; const col = colorKey ? this.p(n, colorKey) : null;
    return `{text:${snbtStr(t)}${col && col !== 'white' ? ',color:' + snbtStr(col) : ''}}`;
  }
  cond(n, k) {
    const L = this.link(n, k);
    if (L) { const src = this.idx.nodes.get(L.a); if (!src) return null; const r = this.evalData(src, L.ap); return (r && typeof r === 'object') ? r : (typeof r === 'string' ? rawCond(r) : null); }
    const pd = (NODES[n.type].props || []).find(x => x.k === k);
    return pd && pd.t !== 'none' ? rawCond(this.p(n, k)) : null;
  }
  condc(n, k) { const e = this.cond(n, k); return e ? this.compileCond(e, n) : null; }
  compileCond(e, n) {
    const tmp = () => this.tmp();
    switch (e.k) {
      case 'lit': return { pre: [], mods: `${e.mod} ${e.txt}`, simple: true };
      case 'and': {
        const it = e.items.map(x => this.compileCond(x, n)).filter(Boolean);
        if (!it.length) { this.diag('err', 'AND condition with no connected inputs.', e.n); return null; }
        return { pre: it.flatMap(x => x.pre), mods: it.map(x => x.mods).join(' '), simple: it.length === 1 && it[0].simple };
      }
      case 'not': {
        const x = this.compileCond(e.item, n); if (!x) return null;
        if (x.simple) return { pre: x.pre, mods: flipMods(x.mods), simple: true };
        const t = this.th(e.n, 'not');
        return { pre: [...x.pre, `scoreboard players set ${t} ${tmp()} 0`, `execute ${x.mods} run scoreboard players set ${t} ${tmp()} 1`], mods: `unless score ${t} ${tmp()} matches 1`, simple: true };
      }
      case 'or': {
        const it = e.items.map(x => this.compileCond(x, n)).filter(Boolean);
        if (!it.length) { this.diag('err', 'OR condition with no connected inputs.', e.n); return null; }
        if (it.length === 1) return it[0];
        const t = this.th(e.n, 'or'), pre = [`scoreboard players set ${t} ${tmp()} 0`];
        it.forEach(x => pre.push(...x.pre, `execute ${x.mods} run scoreboard players set ${t} ${tmp()} 1`));
        return { pre, mods: `if score ${t} ${tmp()} matches 1`, simple: true };
      }
      case 'chance': {
        const t = this.th(e.n, 'rnd'); const pct = String(e.pct).trim();
        return { pre: [`execute store result score ${t} ${tmp()} run random value 1..100`], mods: `if score ${t} ${tmp()} matches ..${pct}`, simple: true };
      }
    }
    return null;
  }
  /* ---- helper per i nodi ---- */
  tmp() { this.usedTmp = true; return `${this.ns}.tmp`; }
  th(n, s) { this.usedTmp = true; return `#${s}.${n ? n.id : 'x'}`; }
  short(n) { return n.id; }
  init(l) { if (!this.initLines.includes(l)) this.initLines.push(l); }
  tick(l) { if (!this.tickLines.includes(l)) this.tickLines.push(l); }
  tickEnd(l) { if (!this.tickEndLines.includes(l)) this.tickEndLines.push(l); }
  uninstall(l) { if (!this.uninst.includes(l)) this.uninst.push(l); }
  objective(name, crit) { this.objectives.set(name, crit); }
  bossbar(id) { this.bossbars.add(id); }
  file(path, text, kind, n) { this.files.set(path, { path, kind, text, graph: this.g ? this.g.id : null, node: n ? n.id : null, label: kind === 'json' ? 'Advancement' : '' }); }
