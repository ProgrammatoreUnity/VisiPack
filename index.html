/* Static tooltips in the HTML: title in English, data-it in Italian */
function applyStaticTips() { $$('[data-it]').forEach(el => { if (!el.dataset.en) el.dataset.en = el.getAttribute('title') || ''; el.setAttribute('title', HELP_LANG === 'it' ? el.dataset.it : el.dataset.en); }); }

function migrate(p) {
  p = deepClone(p);
  p.id = p.id || uid('p');
  p.meta = Object.assign({ name: 'My data pack', namespace: 'pack', description: '', descColor: 'gray', minFormat: PACK_FORMAT_263.slice(), future: false, headers: true, uninstall: true, icon: '' }, p.meta || {});
  p.meta.integrations = Object.assign({ realsize: true, frameeditor: true }, p.meta.integrations || {});
  p.graphs = (p.graphs || []).map(g => ({ frames: [], ...g, nodes: (g.nodes || []).map(n => ({ ...n, p: Object.assign(NODES[n.type] ? nodeDefaults(NODES[n.type]) : {}, n.p || {}) })), links: g.links || [] }));
  if (!p.graphs.length) p.graphs.push(App.newGraph('Main'));
  p.vars = p.vars || []; p.recipes = p.recipes || []; p.files = p.files || [];
  return p;
}
function blankProject() {
  const g = App.newGraph('Main');
  const n = { id: uid('n'), type: 'ev_load', x: 0, y: 0, p: { ...nodeDefaults(NODES.ev_load), path: 'main/load' } };
  const t = { id: uid('n'), type: 'ch_tellraw', x: 320, y: 0, p: { ...nodeDefaults(NODES.ch_tellraw), msg: 'Data pack loaded!', color: 'green' } };
  g.nodes.push(n, t); g.links.push({ id: uid('l'), a: n.id, ap: 'out', b: t.id, bp: '_in' });
  return { id: uid('p'), meta: { name: 'New data pack', namespace: 'new_pack', description: 'Made with VisiPack', integrations: { realsize: true, frameeditor: true } }, graphs: [g], vars: [], recipes: [], files: [] };
}
/* Compact builder for the example project */
function sampleProject() {
  const mk = (type, x, y, p = {}) => ({ id: uid('n'), type, x, y, p: Object.assign(nodeDefaults(NODES[type]), p) });
  const L = (a, ap, b, bp = '_in') => ({ id: uid('l'), a: a.id, ap, b: b.id, bp });
  // Script 1: wand
  const g1 = App.newGraph('Wand');
  const use = mk('ev_use', 0, 32, { path: 'wand/use', cdata: '{bee_wand:1b}' });
  const ray = mk('fl_ray', 336, 32, { dist: 24, step: '0.5' });
  const part = mk('wd_particle', 720, -224, { pt: 'end_rod', pos: '~ ~ ~', delta: '0 0 0', speed: 0, count: 1 });
  const bee = mk('en_summon', 720, 112, { type: 'bee', pos: '~ ~1 ~', rs: 'ask', name: 'Helper Bee', ncolor: 'yellow', tags: 'example.helper' });
  const snd = mk('wd_sound', 1072, 112, { snd: 'block.amethyst_block.chime', target: '@a', pitch: 1.4 });
  const cnt = mk('vr_add', 1424, 112, { var: 'v_api', target: '@s', op: 'add', amt: 1 });
  const miss = mk('ch_title', 720, 448, { target: '@s', kind: 'actionbar', msg: 'Too far away!', color: 'red' });
  g1.nodes.push(use, ray, part, bee, snd, cnt, miss);
  g1.links.push(L(use, 'out', ray), L(ray, 'step', part), L(ray, 'hit', bee), L(bee, 'out', snd), L(snd, 'out', cnt), L(ray, 'miss', miss));
  g1.frames.push({ id: uid('f'), x: 304, y: -288, w: 1440, h: 912, title: 'Right-click → ray from your view → a bee where it hits', color: 'a' });
  // Script 2: welcome
  const g2 = App.newGraph('Welcome');
  const load = mk('ev_load', 0, 0, { path: 'welcome/load' });
  const tell = mk('ch_tellraw', 336, 0, { target: '@a' });
  const txt = mk('vl_text', 0, 144, { segs: [{ type: 'text', text: '[Example] ', color: 'gold', b: true }, { type: 'text', text: 'Data pack loaded! ', color: 'green' }, { type: 'text', text: 'Type /trigger menu', color: 'aqua', u: true, ca: 'suggest_command', cv: '/trigger menu', hv: 'Click to type it in chat' }] });
  const join = mk('ev_join', 0, 432, { path: 'welcome/join', mode: 'first' });
  const give = mk('pl_give', 336, 432, { target: '@s', count: 1 });
  const item = mk('vl_item', 0, 576, { id: 'carrot_on_a_stick', name: 'Bee Wand', ncolor: 'light_purple', lore: 'Right-click to summon\na bee where you look', glint: 'true', model: 'minecraft:blaze_rod', cdata: '{bee_wand:1b}' });
  const ttl = mk('ch_title', 688, 432, { target: '@s', kind: 'title', msg: 'Welcome!', color: 'gold', times: true, fi: 10, st: 50, fo: 15 });
  g2.nodes.push(load, tell, txt, join, give, item, ttl);
  g2.links.push(L(load, 'out', tell), L(txt, 'v', tell, 'msg'), L(join, 'out', give), L(item, 'v', give, 'item'), L(give, 'out', ttl));
  // Script 3: timer & menu
  const g3 = App.newGraph('Timer & menu');
  const tim = mk('ev_timer', 0, 0, { path: 'timer/second', every: 20 });
  const inc = mk('vr_add', 336, 0, { var: 'v_sec', op: 'add', amt: 1 });
  const each = mk('fl_as', 688, 0, { target: '@a', at: false });
  const iff = mk('fl_if', 1040, 0);
  const has = mk('cd_item', 688, 240, { sel: '@s', slot: 'weapon.mainhand', item: 'carrot_on_a_stick', cdata: '{bee_wand:1b}' });
  const bar = mk('ch_title', 1392, 0, { target: '@s', kind: 'actionbar' });
  const btxt = mk('vl_text', 1040, 256, { segs: [{ type: 'text', text: 'Bees summoned: ', color: 'yellow' }, { type: 'var', var: 'v_api', text: '@s', color: 'gold', b: true }] });
  const trig = mk('ev_trigger', 0, 544, { path: 'timer/menu', obj: 'menu' });
  const mtell = mk('ch_tellraw', 336, 544, { target: '@s' });
  const mtxt = mk('vl_text', 0, 720, { segs: [{ type: 'text', text: 'The pack has been running for ', color: 'gray' }, { type: 'var', var: 'v_sec', color: 'white', b: true }, { type: 'text', text: ' seconds. ', color: 'gray' }, { type: 'text', text: '[Reset bees]', color: 'red', ca: 'run_command', cv: '/function example:reset_bees', hv: 'Requires operator rights' }] });
  const fn = mk('ev_func', 688, 544, { path: 'reset_bees' });
  const rs = mk('vr_set', 1040, 544, { var: 'v_api', target: '@a', mode: 'val', val: 0 });
  const ok = mk('ch_tellraw', 1392, 544, { target: '@a', msg: 'Bee counter reset.', color: 'yellow' });
  g3.nodes.push(tim, inc, each, iff, has, bar, btxt, trig, mtell, mtxt, fn, rs, ok);
  g3.links.push(L(tim, 'out', inc), L(inc, 'out', each), L(each, 'body', iff), L(has, 'c', iff, 'cond'), L(iff, 'yes', bar), L(btxt, 'v', bar, 'msg'), L(trig, 'out', mtell), L(mtxt, 'v', mtell, 'msg'), L(fn, 'out', rs), L(rs, 'out', ok));
  return {
    id: uid('p'),
    meta: { name: 'Example: Bee Wand', namespace: 'example', description: 'Example made with VisiPack', descColor: 'gold', integrations: { realsize: true, frameeditor: true } },
    graphs: [g1, g2, g3],
    vars: [{ id: 'v_api', name: 'bees_summoned', scope: 'entity', label: 'Bees summoned' }, { id: 'v_sec', name: 'seconds', scope: 'global', init: '0', visible: false }],
    recipes: [{ id: uid('r'), name: 'wand', type: 'crafting_shaped', grid: ['', '', 'honeycomb', '', 'stick', '', 'stick', '', ''], result: 'carrot_on_a_stick', count: 1, cat: 'equipment', rname: 'Rough Wand' }],
    files: [{ id: uid('x'), path: 'data/example/predicate/is_night.json', text: JSON.stringify({ type: 'minecraft:time_check', clock: 'minecraft:overworld', value: { min: 13000, max: 23000 }, period: 24000 }, null, 2) }],
  };
}

/* ============ Boot ============ */
function buildDatalists() {
  const lists = {
    entities: ENTITIES.map(e => 'minecraft:' + e), items: ITEMS.map(i => 'minecraft:' + i), blocks: BLOCKS.map(b => 'minecraft:' + b), effects: EFFECTS.map(e => 'minecraft:' + e),
    particles: PARTICLES, sounds: SOUNDS, attributes: ATTRIBUTES.map(a => 'minecraft:' + a), gamerules: GAMERULES, enchants: ENCHANTS.map(e => 'minecraft:' + e),
    damage: DAMAGE_TYPES.map(d => 'minecraft:' + d), dims: DIMENSIONS, biomes: BIOMES.map(b => 'minecraft:' + b), slots: SLOTS,
    selectors: ['@a', '@p', '@s', '@e', '@r', '@n', '@a[distance=..10]', '@e[type=minecraft:item]', '@e[tag=pack.marked]'],
    sorts: ['nearest', 'furthest', 'random', 'arbitrary'], gamemodes: GAMEMODES, times: ['day', 'noon', 'night', 'midnight', '1000', '6000', '13000', '18000'],
  };
  const host = $('#datalists');
  Object.entries(lists).forEach(([k, arr]) => { const dl = h('datalist', { id: 'dl-' + k }); arr.forEach(v => dl.append(h('option', { value: v }))); host.append(dl); });
  host.append(h('datalist#dl-functions'), h('datalist#dl-recipes'));
}
function refreshDynLists() {
  const f = $('#dl-functions'), r = $('#dl-recipes'); if (!f) return;
  f.innerHTML = ''; r.innerHTML = '';
  App.proj.graphs.forEach(g => g.nodes.forEach(n => { if (n.type === 'ev_func' && n.p.path) f.append(h('option', { value: n.p.path })); }));
  ['realsize:reroll', 'frame_editor:glow_on', 'frame_editor:glow_off', 'frame_editor:tag_nearby'].forEach(v => f.append(h('option', { value: v })));
  (App.proj.recipes || []).forEach(x => r.append(h('option', { value: App.proj.meta.namespace + ':' + x.name })));
}
function wireUI() {
  $('#b-undo').addEventListener('click', () => App.undo());
  $('#b-redo').addEventListener('click', () => App.redo());
  $('#b-export').addEventListener('click', () => App.exportZip());
  $('#b-projects').addEventListener('click', () => App.projects());
  $('#b-menu').addEventListener('click', e => {
    const r = e.currentTarget.getBoundingClientRect();
    ED.menu(r.right - 260, r.bottom + 6, [
      window.__vpInstall ? { l: 'Install as app', icon: 'dl', act: () => window.__vpInstall() } : null,
      { l: 'Projects…', icon: 'folder', act: () => App.projects() },
      { l: 'Export project (.json)', icon: 'dl', act: () => App.exportProject() },
      { l: 'Import project (.json)', icon: 'ul', act: () => App.importProject() },
      { l: 'Import .mcfunction commands', icon: 'code', act: () => Panels.importCommands() },
      '-',
      { l: 'Save now', icon: 'cloud', k: 'Ctrl S', act: () => App.saveNow() },
      { l: 'Pack settings', icon: 'gear', act: () => App.open('settings') },
      { l: 'Keyboard shortcuts', icon: 'key', act: () => Panels.shortcuts() },
      { l: HELP_LANG === 'it' ? 'Tooltips & descriptions: English' : 'Tooltips & descriptions: Italiano', icon: 'info', act: () => App.setHelpLang(HELP_LANG === 'it' ? 'en' : 'it') },
      '-',
      { l: 'Theme: automatic', icon: 'sparkle', act: () => App.theme('') },
      { l: 'Theme: dark', icon: 'moon', act: () => App.theme('dark') },
      { l: 'Theme: light', icon: 'sun', act: () => App.theme('light') },
    ]);
  });
  $('#pname').addEventListener('input', e => { App.proj.meta.name = e.target.value; App.softCommit(); App.changed({ soft: true }); });
  $('#pname').addEventListener('change', () => Panels.explorer());
  $$('#ltabs button').forEach(b => b.addEventListener('click', () => Panels.tabL(b.dataset.t)));
  $$('#rtabs button').forEach(b => b.addEventListener('click', () => Panels.tab(b.dataset.t)));
  $('#st-probs').addEventListener('click', () => Panels.tab('probs'));
  $('#t-add').addEventListener('click', () => { const r = $('#t-add').getBoundingClientRect(); ED.openSearch(r.left, r.bottom + 6); });
  $('#t-fit').addEventListener('click', () => ED.fit());
  $('#t-zin').addEventListener('click', () => ED.zoomBy(1.2));
  $('#t-zout').addEventListener('click', () => ED.zoomBy(1 / 1.2));
  $('#t-frame').addEventListener('click', () => ED.frameSel());
  const snap = $('#t-snap'); snap.classList.toggle('on', App.prefs.snap); snap.setAttribute('aria-pressed', App.prefs.snap ? 'true' : 'false');
  snap.addEventListener('click', () => { App.prefs.snap = !App.prefs.snap; snap.classList.toggle('on', App.prefs.snap); snap.setAttribute('aria-pressed', App.prefs.snap ? 'true' : 'false'); App.savePrefs(); toast(App.prefs.snap ? 'Grid snapping on' : 'Grid snapping off', 'info', 1400); });
  $('#b-left').addEventListener('click', () => document.body.classList.contains('dl-open') ? App.closeDrawers() : App.openDrawer('l'));
  $('#b-right').addEventListener('click', () => document.body.classList.contains('dr-open') ? App.closeDrawers() : App.openDrawer('r'));
  $('#scrim').addEventListener('click', () => App.closeDrawers());
  $('#empty-add').addEventListener('click', () => { const r = ED.el.getBoundingClientRect(); ED.openSearch(r.left + r.width / 2 - 170, r.top + r.height / 2 - 160); });
  document.addEventListener('keydown', e => {
    const typing = e.target.closest && e.target.closest('input,textarea,select,[contenteditable="true"]');
    const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if (mod && k === 's') { e.preventDefault(); App.saveNow(); return; }
    if (mod && k === 'e') { e.preventDefault(); App.exportZip(); return; }
    if (typing || $('.modal-bg') || $('.finder')) return;
    if (e.key === 'Escape') { closePopovers(); ED.closeMenu(); App.closeDrawers(); if (App.sel.size || App.selFrame) { App.sel = new Set(); App.selFrame = null; App.selectionChanged(); } return; }
    if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? App.redo() : App.undo(); return; }
    if (mod && k === 'y') { e.preventDefault(); App.redo(); return; }
    if (App.view !== 'graph') return;
    if (mod && k === 'c') { if (ED.copySel()) toast('Copied', 'info', 1000); return; }
    if (mod && k === 'x') { if (ED.copySel()) ED.deleteSel(); return; }
    if (mod && k === 'd') { e.preventDefault(); ED.duplicate(); return; }
    if (mod && k === 'a') { e.preventDefault(); App.sel = new Set(App.graph().nodes.map(n => n.id)); App.selectionChanged(); return; }
    if (mod) return;
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); ED.deleteSel(); return; }
    if (e.key === ' ') { e.preventDefault(); if (ED.last.inside) ED.openSearch(ED.last.x, ED.last.y); else ED.openSearch(); return; }
    if (k === 'f') { ED.fit(App.sel.size > 0); return; }
    if (k === 'c') { ED.frameSel(); return; }
    if (k === 'm') { ED.toggleOff(); Panels.inspector(); return; }
  });
  document.addEventListener('paste', e => {
    if (e.target.closest && e.target.closest('input,textarea,select,[contenteditable="true"]')) return;
    if (App.view !== 'graph' || $('.modal-bg')) return;
    const t = (e.clipboardData && e.clipboardData.getData('text')) || '';
    let clip = null; try { const j = JSON.parse(t); if (j && (j.visipack || j.catena) && j.nodes) clip = j; } catch (_) { }
    e.preventDefault();
    if (clip) { ED.paste(clip); return; }
    if (t.trim() && !App.clip) {
      const p = ED.last.inside ? ED.toWorld(ED.last.x, ED.last.y) : ED.toWorld(ED.el.getBoundingClientRect().left + 200, ED.el.getBoundingClientRect().top + 200);
      const n = ED.addNode('ad_raw', p.x, p.y); n.p.cmd = t.trim(); ED.refreshNode(n.id); App.commit(); App.changed({}); Panels.inspector();
      toast('Commands pasted into a Command node.', 'info'); return;
    }
    if (App.clip) ED.paste(App.clip);
  });
  window.addEventListener('resize', () => { if (innerWidth > 980) App.closeDrawers(); });
}
function boot() {
  App.hostTheme = document.documentElement.getAttribute('data-theme');
  let prefs = null; try { prefs = JSON.parse(store.get(LS_PREFS) || store.get(LS_OLD_PREFS) || 'null'); } catch (_) { }
  if (prefs) Object.assign(App.prefs, prefs);
  HELP_LANG = App.prefs.helpLang === 'it' ? 'it' : 'en';
  if (App.prefs.theme) document.documentElement.setAttribute('data-theme', App.prefs.theme);
  $$('i[data-ic]').forEach(i => i.replaceWith(icon(i.dataset.ic, +i.dataset.s || 16)));
  applyStaticTips();
  buildDatalists();
  ED.mount();
  wireUI();
  let saved = null; try { saved = JSON.parse(store.get(LS_PROJ) || store.get(LS_OLD_PROJ) || 'null'); } catch (_) { }
  if (saved && saved.proj && saved.proj.graphs) {
    App.hadLocal = true; App.localSavedAt = saved.at;
    App.load(saved.proj, { views: App.prefs.views || {}, gid: saved.gid });
    App.localAt = saved.at; App.localOk = true;
  } else App.load(sampleProject(), { views: {} });
  const _rc = App.recompile.bind(App);
  App.recompile = function () { _rc(); refreshDynLists(); };
  refreshDynLists();
  App.status(); App.undoBtns();
  App.initCloud();
  getDownloads();
  if (!App.hadLocal) setTimeout(() => toast('This is an example project: edit it, or start a new one from Projects.', 'info', 5200), 600);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
